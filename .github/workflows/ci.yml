name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  java:
    name: Tests ${{ matrix.service }}
    runs-on: ubuntu-latest
    # Une "matrice" : le même job est lancé une fois par microservice Java.
    strategy:
      matrix:
        service: [simulator, kpi-service]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml
      - name: Compiler et lancer les tests
        run: mvn -B verify

  dashboard:
    name: Tests dashboard (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - name: Tests unitaires
        run: npm run test:ci
      - name: Build de production
        run: npx ng build --configuration production
