services:

  # Kafka en mode KRaft : un seul conteneur, pas besoin de ZooKeeper.
  kafka:
    image: apache/kafka:3.8.0
    container_name: factorypulse-kafka
    ports:
      - "9092:9092"   # accès depuis ton PC (IDE) : localhost:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Interface web pour voir les topics et les messages : http://localhost:8090
  # (8090 et pas 8080, pour ne pas entrer en conflit avec une autre application Spring Boot locale)
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: factorypulse-kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: factorypulse
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  # Le simulateur de machines (Spring Boot)
  simulator:
    build: ./simulator
    container_name: factorypulse-simulator
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  # Base de données des indicateurs (jour 2)
  mongo:
    image: mongo:7.0
    container_name: factorypulse-mongo
    ports:
      - "27017:27017"   # accès depuis ton PC (IDE, MongoDB Compass) : mongodb://localhost:27017
    volumes:
      - mongo-data:/data/db   # les données survivent à un redémarrage des conteneurs
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Serveur d'identité (jour 5) : connexion des utilisateurs, rôles, jetons JWT.
  # Console d'administration : http://localhost:8180 (admin / admin, uniquement pour le développement)
  # Le realm "factorypulse" (rôles, utilisateurs de démo, client du dashboard) est importé au démarrage.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    container_name: factorypulse-keycloak
    command: start-dev --import-realm
    ports:
      - "8180:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Adresse publique de Keycloak (celle du navigateur) : c'est elle qui apparaît dans les jetons.
      KC_HOSTNAME: http://localhost:8180
      # Les services, eux, joignent Keycloak par le réseau Docker (http://keycloak:8080).
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      # Adresse publique du tableau de bord, insérée dans le realm à l'import (${FP_PUBLIC_URL}).
      FP_PUBLIC_URL: ${FP_PUBLIC_URL:-http://localhost:4300}
    volumes:
      - ./keycloak/factorypulse-realm.json:/opt/keycloak/data/import/factorypulse-realm.json:ro

  # Le service de calcul des indicateurs : lit Kafka, calcule le TRS, stocke dans MongoDB (jour 2)
  # API : http://localhost:8082/api/kpis
  kpi-service:
    build: ./kpi-service
    container_name: factorypulse-kpi-service
    ports:
      - "8082:8082"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MONGODB_URI: mongodb://mongo:27017/factorypulse
      KEYCLOAK_JWKS: http://keycloak:8080/realms/factorypulse/protocol/openid-connect/certs
    depends_on:
      keycloak:
        condition: service_started
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy

  # Le service d'alertes : lit les mêmes événements Kafka (autre consumer group),
  # détecte les pannes et les rebuts anormaux, publie dans le topic machine-alerts (jour 4)
  # API : http://localhost:8083/api/alerts
  alert-service:
    build: ./alert-service
    container_name: factorypulse-alert-service
    ports:
      - "8083:8083"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MONGODB_URI: mongodb://mongo:27017/factorypulse_alerts
      KEYCLOAK_JWKS: http://keycloak:8080/realms/factorypulse/protocol/openid-connect/certs
    depends_on:
      keycloak:
        condition: service_started
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy

  # Le tableau de bord Angular, servi par nginx (jour 3) : http://localhost:4300
  # nginx redirige /api et /ws vers le kpi-service, /api/alerts et /ws-alerts vers l'alert-service.
  dashboard:
    build: ./dashboard
    container_name: factorypulse-dashboard
    ports:
      - "4300:80"
    depends_on:
      - kpi-service
      - alert-service

volumes:
  mongo-data:
