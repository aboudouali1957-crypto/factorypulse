# Sert le tableau de bord Angular et redirige l'API et les WebSockets vers le bon microservice.
# Le navigateur ne parle qu'à une seule adresse : pas de problème de CORS.
# nginx choisit le bloc "location" dont le préfixe est le plus long :
# /api/alerts va donc à l'alert-service, le reste de /api au kpi-service.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API REST des alertes -> alert-service
    location /api/alerts {
        proxy_pass http://alert-service:8083;
    }

    # API REST des indicateurs -> kpi-service
    location /api/ {
        proxy_pass http://kpi-service:8082;
    }

    # WebSocket des alertes -> alert-service
    location /ws-alerts {
        proxy_pass http://alert-service:8083;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
    }

    # WebSocket des indicateurs -> kpi-service (les en-têtes Upgrade permettent de passer de HTTP à WebSocket)
    location /ws {
        proxy_pass http://kpi-service:8082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
    }

    # Application Angular (une seule page)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
