services:

  # Kafka en mode KRaft : un seul conteneur, pas besoin de ZooKeeper.
  kafka:
    image: apache/kafka:3.8.0
    container_name: factorypulse-kafka
    ports:
      - "9092:9092"   # accès depuis ton PC (IDE) : localhost:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Interface web pour voir les topics et les messages : http://localhost:8090
  # (8090 et pas 8080, pour ne pas entrer en conflit avec une autre application Spring Boot locale)
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: factorypulse-kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: factorypulse
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  # Le simulateur de machines (Spring Boot)
  simulator:
    build: ./simulator
    container_name: factorypulse-simulator
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  # Base de données des indicateurs (jour 2)
  mongo:
    image: mongo:7.0
    container_name: factorypulse-mongo
    ports:
      - "27017:27017"   # accès depuis ton PC (IDE, MongoDB Compass) : mongodb://localhost:27017
    volumes:
      - mongo-data:/data/db   # les données survivent à un redémarrage des conteneurs
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Le service de calcul des indicateurs : lit Kafka, calcule le TRS, stocke dans MongoDB (jour 2)
  # API : http://localhost:8082/api/kpis
  kpi-service:
    build: ./kpi-service
    container_name: factorypulse-kpi-service
    ports:
      - "8082:8082"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MONGODB_URI: mongodb://mongo:27017/factorypulse
    depends_on:
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy

  # Le tableau de bord Angular, servi par nginx (jour 3) : http://localhost:4300
  # nginx redirige /api et /ws vers le kpi-service.
  dashboard:
    build: ./dashboard
    container_name: factorypulse-dashboard
    ports:
      - "4300:80"
    depends_on:
      - kpi-service

volumes:
  mongo-data:
