# Sert le tableau de bord Angular et redirige l'API et le WebSocket vers le kpi-service.
# Le navigateur ne parle qu'à une seule adresse : pas de problème de CORS.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API REST -> kpi-service
    location /api/ {
        proxy_pass http://kpi-service:8082;
    }

    # WebSocket -> kpi-service (les en-têtes Upgrade permettent de passer de HTTP à WebSocket)
    location /ws {
        proxy_pass http://kpi-service:8082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
    }

    # Application Angular (une seule page)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
